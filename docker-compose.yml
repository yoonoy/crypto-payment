services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://payments:payments@db:5432/payments
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped
volumes:
  pgdata:
